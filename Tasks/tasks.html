<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <style>
      .info-box {
        width: 200px;
        background-color: #d0e8ff;
        margin-bottom: 10px;
        /* Ваш код здесь */
        padding: 15px;
      }

      .alert-box {
        width: 200px;
        background-color: #ffe0d0;
        /* Ваш код здесь */
        padding: 10px 25px 10px 5px;
      }
    </style>
  </head>
  <body>
    <div class="info-box">Информационное сообщение</div>
    <div class="alert-box">Предупреждающее сообщение</div>
  </body>
</html>

<!-- 
Описание: Задайте свойство padding с помощью сокращённой записи для двух блочных элементов с классами "info-box" и "alert-box" в CSS, чтобы получить разные внутренние отступы с каждой стороны блока.

Входные данные: HTML-структура с двумя div-элементами (см. шаблон), у каждого уже заданы одинаковые width (200px) и цвет фона для наглядности, внутри есть текстовое содержимое.

Выходные данные: Два блока одинаковой ширины, расположенные друг под другом — один с одинаковым отступом со всех четырёх сторон, другой с разными отступами сверху/справа/снизу/слева.

Ограничения:

Используйте свойство padding в сокращённой записи (shorthand)
info-box должен иметь padding: 15px (одно значение — одинаковый отступ со всех сторон)
alert-box должен иметь padding: 10px 25px 10px 5px (четыре значения — сверху, справа, снизу, слева соответственно)
Не изменяйте значение width, заданное в шаблоне
Не используйте flexbox, grid, media queries, CSS-переменные, препроцессоры
Примеры:
Input: div с классом "info-box"
Output: элемент с отступом 15px с каждой стороны (сверху, справа, снизу, слева)

Input: div с классом "alert-box"
Output: элемент с отступом 10px сверху, 25px справа, 10px снизу, 5px слева -->
