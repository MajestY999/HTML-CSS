<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Панель инструментов</title>
    <style>
      /* **Описание**: Создайте CSS-правило, используя комбинированный селектор (тег вместе с классом),
       которое стилизует только элементы <button> с классом action внутри готовой HTML-разметки панели инструментов.

       **Входные данные**: Готовая HTML-разметка панели инструментов (см. ниже в <body>).

       **Выходные данные**: CSS-правило внутри тега <style>, которое применяет стили ТОЛЬКО
       к элементам <button> с классом action.

       **Ограничения**:
       - Используйте комбинированный селектор (тег + класс без пробела, например тег.класс)
       - Установите цвет фона: #27ae60
       - Установите цвет текста: #ffffff
       - Установите внутренний отступ: 12px
       - Установите ширину рамки: 1px со стилем solid и цветом #1e8449
       - HTML-разметку изменять нельзя
       - Обычная кнопка «Отмена», ссылка <a class="action"> и <span class="action"> НЕ должны получить эти стили
    */

      /* Ваш код здесь */

      button.action {
        background-color: #27ae60;
        color: #ffffff;
        padding: 12px;
        border: 1px solid #1e8449;
      }
    </style>
  </head>
  <body>
    <div class="toolbar">
      <button class="action">Сохранить</button>
      <button>Отмена</button>
      <a class="action" href="#">Ссылка-действие</a>
      <button class="action">Удалить</button>
      <span class="action">Метка</span>
    </div>
  </body>
</html>
