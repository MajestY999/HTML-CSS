<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PurpleForm</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <h1>Свяжитесь со мной</h1>
      <form action="#">
        <div class="field">
          <img src="./images/message.svg" alt="Иконка сообщения">
          <label for="email">E-mail</label>
          <label for="email"></label>
          <input
            type="email"
            id="email"
            name="email"
          placeholder="введите свой E-mail"
            required
          />
        </div>
        <div class="field">
          <img src="./images/telegram.svg" alt="Иконка сообщения">
          <label for="telegram">telegram</label>
          <input
            type="text"
            name="telegram"
            id="telegram"
            placeholder="Введите свой телеграмм"
            required
          />
        </div>
        <div class="field">
          <img src="./images/topic.svg" alt="Иконка сообщения">
          <label for="topic">Тема</label>
          <select name="topic" id="topic" required>
            <optgroup label="Выберете тему">
              <option value="1" selected>Приобретение курсов</option>
              <option value="2">Обратная связь</option>
            </optgroup>
          </select>
        </div>
        <div class="field">
          <label for="comment">Комментарий</label>
          <textarea
            cols="76"
            rows="5"
            name="comment"
            id="comment"
            placeholder="Введите текст"
          >
Хочу купить ваши курсы для своих сотрудников и они станут очень умными. Направьте, пожалуйста, свои реквизиты для выставления счета. Хочу купить ваши курсы для своих сотрудников и они станут очень умными. Направьте, пожалуйста, свои реквизиты для выставления счета.</textarea
          >
        </div>

        <button type="submit">Отправить</button>
      </form>
    </main>
  </body>
</html>
